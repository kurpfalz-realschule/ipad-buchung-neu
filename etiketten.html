<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRS iPad-Buchung — Etiketten zum Drucken</title>
  <style>
    :root { --border:#cbd5e1; --text:#1e293b; --muted:#64748b; --accent:#7c3aed; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: var(--text); margin: 0; background: #f1f5f9; }
    .toolbar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 10; }
    .toolbar h1 { font-size: 16px; margin: 0; flex: 1; }
    .toolbar button { min-height: 40px; padding: 0 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    .toolbar label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    main { padding: 16px; max-width: 920px; margin: 0 auto; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 22px 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .label { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; background: #fff; text-align: center; page-break-inside: avoid; break-inside: avoid; }
    .label .name { font-size: 14px; font-weight: 700; }
    .label .sub { font-size: 11px; color: var(--muted); margin-bottom: 6px; min-height: 14px; }
    .label .codes-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .label .codes-row svg { flex: 1; min-width: 0; height: 48px; }
    .label .qr-box { flex: none; width: 56px; height: 56px; }
    .label .qr-box canvas, .label .qr-box img { width: 100% !important; height: 100% !important; }
    .label .code { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: .5px; }
    .label.action { border-style: solid; border-color: var(--accent); }
    .hint { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
    .label .nr { display:inline-block; background: var(--accent); color:#fff; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
    .label .bereich { font-size: 12px; font-weight: 700; color: var(--text); }
    /* Wandliste Lehrkraefte: schmaler als die Koffer-Etiketten, damit ein
       ganzes Kollegium auf wenige Seiten passt. */
    .lehrer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
    .lehrer-grid .label { padding: 8px; }
    .lehrer-grid .label .name { font-size: 13px; }
    .lehrer-grid .label .codes-row svg { height: 34px; }
    .lehrer-grid .label .qr-box { width: 40px; height: 40px; }
    body.nur-koffer #sec-lehrer { display: none; }
    body.nur-lehrer #sec-koffer, body.nur-lehrer #sec-aktionen { display: none; }
    .warn { color: #b45309; background: #fef3c7; border: 1px solid #d97706; border-radius: 8px; padding: 8px 12px; font-size: 12px; }

    /* ══ Etikettenbogen Avery Zweckform 3481 ═════════════════════════
       70 x 41 mm, 21 Etiketten je A4-Bogen, 3 Spalten x 7 Zeilen.
       Waagerecht geht die Rechnung exakt auf: 3 x 70 mm = 210 mm = A4.
       Senkrecht bleiben 297 - 7 x 41 = 10 mm uebrig, die als je 5 mm
       oben und unten angenommen sind (die Etiketten liegen ohne Abstand
       aneinander). Diese 5 mm sind AUS DER BOGENGROESSE GERECHNET, nicht
       aus einem Datenblatt abgelesen -- deshalb der Testdruck und die
       Justierung in Millimetern weiter unten.
       ════════════════════════════════════════════════════════════════ */
    .zf-sheet { width: 210mm; background: #fff; margin: 0 auto 12px; position: relative; overflow: hidden; }
    .zf-inner { padding: 5mm 0; position: relative; }
    .zf-grid { display: grid; grid-template-columns: repeat(3, 70mm); grid-auto-rows: 41mm; }
    .zf-label { width: 70mm; height: 41mm; padding: 2.5mm 3mm; display: flex; flex-direction: column;
                justify-content: space-between; align-items: center; text-align: center; overflow: hidden;
                page-break-inside: avoid; break-inside: avoid; }
    .zf-label.leer { background: repeating-linear-gradient(45deg, #f8fafc, #f8fafc 4px, #eef2f7 4px, #eef2f7 8px); }
    .zf-kopf { display: flex; align-items: baseline; gap: 2mm; justify-content: center; }
    .zf-nr { background: #111827; color: #fff; border-radius: 1.5mm; padding: 0.3mm 2mm; font-size: 11pt; font-weight: 800; line-height: 1.2; }
    .zf-bereich { font-size: 10pt; font-weight: 700; }
    .zf-sub { font-size: 7.5pt; color: #334155; line-height: 1.2; }
    .zf-codes { display: flex; align-items: center; gap: 2mm; width: 100%; }
    .zf-codes svg { flex: 1; min-width: 0; height: 13mm; }
    .zf-qr { flex: none; width: 13mm; height: 13mm; }
    .zf-qr canvas, .zf-qr img { width: 100% !important; height: 100% !important; }
    .zf-code { font-size: 6.5pt; color: #475569; letter-spacing: .4px; }
    /* Am Bildschirm Hilfslinien, im Druck nicht -- sonst klebt ein Rahmen mit. */
    .zf-label { outline: 1px dashed #cbd5e1; outline-offset: -1px; }
    body.zf #sec-koffer .grid { display: none; }
    body:not(.zf) .zf-sheet { display: none; }
    @media print {
      .toolbar, .hint, .warn { display: none !important; }
      .lehrer-grid .label { border-color: #94a3b8; }
      body { background: #fff; }
      main { max-width: none; padding: 0; }
      .label { border-color: #94a3b8; }
      h2 { page-break-after: avoid; }
      /* Etikettenbogen: randlos und exakt EIN Bogen je Seite. Ohne das
         page-break-after wuerden die Wand-Codes auf derselben Seite
         weiterlaufen und der Bogen saesse nicht mehr im Raster. */
      .zf-label { outline: none; }
      .zf-sheet { margin: 0; width: 210mm; page-break-after: always; break-after: page; }
      .zf-sheet + .zf-sheet { page-break-before: always; }
      /* @page steht auf margin:0, damit die Etiketten bis an den Blattrand
         reichen. Die Papierseiten brauchen ihren Rand deshalb selbst. */
      #sec-aktionen, #sec-lehrer { padding: 12mm 10mm; }
      body.zf #sec-koffer h2, body.zf #sec-koffer .hint { display: none !important; }
      .zf-raster-test .zf-label { outline: 1px solid #94a3b8 !important; outline-offset: -1px; }
    }
    @media print { @page { size: A4; margin: 0; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.js"></script>
  <script src="daten.js"></script>
</head>
<body>
  <div class="toolbar">
    <h1>🏷️ iPad-Buchung — Etiketten</h1>
    <span class="hint" id="status"></span>
    <label><input type="radio" name="was" value="alles" checked> alles</label>
    <label><input type="radio" name="was" value="koffer"> nur Koffer</label>
    <label><input type="radio" name="was" value="lehrer"> nur Lehrerliste</label>
    <label>Koffer-Etiketten:
      <select id="format">
        <option value="zf3481" selected>Zweckform 3481 · 70 × 41 mm · 21/Blatt</option>
        <option value="frei">Freies Raster (zum Ausschneiden)</option>
      </select>
    </label>
    <label id="frei-wrap">Plätze freilassen: <input type="number" id="freilassen" min="0" max="20" step="1" value="0" style="width:56px"></label>
    <label id="just-wrap">Justierung mm X <input type="number" id="offx" step="0.5" value="0" style="width:56px">
      Y <input type="number" id="offy" step="0.5" value="0" style="width:56px"></label>
    <label id="test-wrap"><input type="checkbox" id="rastertest"> Raster-Testdruck</label>
    <button onclick="window.print()">🖨️ Drucken</button>
  </div>
  <main id="root">
    <p class="hint">Lade Koffer aus der Datenbank …</p>
  </main>

  <script>
  (function () {
    'use strict';
    // S3 (19.09.2026): Koffer-Etiketten kommen jetzt aus koffer_physisch
    // (WHERE aktiv) statt aus daten.js -- sonst driften Etikett und Bestand
    // auseinander (Vertraege fuer Sonnet). daten.js bleibt nur Rueckfall,
    // falls die DB nicht erreichbar ist (z.B. offline geoeffnet), UND liefert
    // weiterhin die Aktions-/Stunden-Codes (die stehen nicht in der DB).
    // 20.09.2026: Entscheidung E5 ist revidiert. Es gibt jetzt BEIDES --
    //  · auf dem eigenen iPad ist man angemeldet und scannt nur den Koffer
    //    (Station-Modus "Ich selbst"),
    //  · an der Wand haengt zusaetzlich eine Lehrerliste mit Barcode
    //    L-<Kuerzel>, damit die Wandstation ohne eigenes Geraet funktioniert.
    // Die Liste kommt aus get_kollegium_public() (nur mit Session; anon hat
    // kein EXECUTE) und enthaelt Name + Kuerzel -- bewusst so entschieden
    // (Norbert, 20.09.2026). Sie enthaelt KEINE Mailadressen, keine IDs und
    // keinerlei Schuelerdaten.
    var SUPABASE_URL = 'https://ooejsfixxiuobrpqgfqm.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vZWpzZml4eGl1b2JycHFnZnFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwMjQ5MDYsImV4cCI6MjA4OTYwMDkwNn0.GbAv-sB4B8nNE3IPfiYIjbkMKs0Aq03c_-TUcmFY_5s';

    var M = window.KRS_MEDIEN || { KOFFER: [], AKTIONEN: [], SLOTS: [] };
    var root = document.getElementById('root');
    var statusEl = document.getElementById('status');

    // Standort-Klartext. Der Schluessel bleibt 'LZ'/'1OG'; Korrektur
    // 20.09.2026: LZ = Lehrerzimmer (nicht Lernzentrum), 1OG = Kartenraum.
    var STANDORT_LABEL = { LZ: 'Lehrerzimmer', '1OG': 'Kartenraum (1. OG)' };
    function standortLabel(x) { return STANDORT_LABEL[x] || x || ''; }
    // Koffer 1 = iPads 1-10 ... Koffer 12 = 111-120. Nummer aus dem Barcode,
    // Bereich aus Nummer x Kapazitaet -- keine zweite Datenquelle.
    function kofferNummer(k) {
      var m = /^KOFFER-0*(\d+)$/i.exec((k && k.barcode) || '');
      return m ? Number(m[1]) : null;
    }
    function bereichText(k) {
      var nr = kofferNummer(k), cap = Number(k && k.kapazitaet) || 0;
      if (!nr || cap < 2 || (k.typ && k.typ !== 'ipad_koffer')) return '';
      return 'iPads ' + ((nr - 1) * cap + 1) + '\u2013' + (nr * cap);
    }
    function label(value, name, sub, isAction, nr, bereich) {
      var div = document.createElement('div');
      div.className = 'label' + (isAction ? ' action' : '');
      if (nr != null) { var b = document.createElement('div'); b.className = 'nr'; b.textContent = 'Koffer ' + nr; div.appendChild(b); }
      var h = document.createElement('div'); h.className = 'name'; h.textContent = name; div.appendChild(h);
      if (bereich) { var br = document.createElement('div'); br.className = 'bereich'; br.textContent = bereich; div.appendChild(br); }
      var s = document.createElement('div'); s.className = 'sub'; s.textContent = sub || ''; div.appendChild(s);
      var row = document.createElement('div'); row.className = 'codes-row'; div.appendChild(row);
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); row.appendChild(svg);
      var qrBox = document.createElement('div'); qrBox.className = 'qr-box'; row.appendChild(qrBox);
      var code = document.createElement('div'); code.className = 'code'; code.textContent = value; div.appendChild(code);
      // CODE128 fuer den Handscanner
      try {
        var BAR = window.JsBarcode;
        if (BAR) BAR(svg, value, { format: 'CODE128', displayValue: false, margin: 0, height: 48 });
      } catch (err) { /* Barcode konnte nicht gerendert werden -- Etikett bleibt trotzdem lesbar (Klartext) */ }
      // QR zusaetzlich fuer die Kamera (Kontext 10: liest schraeg/teilverdeckt).
      // Nutzinhalt exakt derselbe Wert -- KEINE URL, KEIN JSON (Vertraege fuer Sonnet).
      try {
        if (window.QRCode && window.QRCode.toCanvas) {
          var canvas = document.createElement('canvas');
          qrBox.appendChild(canvas);
          window.QRCode.toCanvas(canvas, value, { width: 100, margin: 0 }, function (err) { if (err) qrBox.textContent = ''; });
        }
      } catch (err2) { /* QR optional -- CODE128 traegt den Druck allein, falls QR scheitert */ }
      return div;
    }
    function section(title, hintText, id, gridClass) {
      var wrap = document.createElement('div');
      if (id) wrap.id = id;
      var h = document.createElement('h2'); h.textContent = title; wrap.appendChild(h);
      if (hintText) { var p = document.createElement('p'); p.className = 'hint'; p.textContent = hintText; wrap.appendChild(p); }
      var g = document.createElement('div'); g.className = gridClass || 'grid'; wrap.appendChild(g);
      root.appendChild(wrap);
      return g;
    }

    function render(koffer, quelle, lehrer) {
      root.innerHTML = '';
      if (quelle === 'fallback') {
        var w = document.createElement('div'); w.className = 'warn'; w.setAttribute('data-testid', 'warn-db');
        w.textContent = '⚠️ Datenbank nicht erreichbar -- Etiketten aus der lokalen Datei daten.js (kann veraltet sein). Bitte vor dem Anbringen mit dem tatsaechlichen Bestand abgleichen.';
        root.appendChild(w);
      }

      // 1 . Koffer (aus der DB, nur aktive -- stillgelegte Dubletten damit
      // automatisch draussen)
      var g1 = section('Koffer / Geräte (am Koffer anbringen)',
        'Koffer 1 = iPads 1–10, Koffer 2 = 11–20 … Koffer 12 = 111–120.', 'sec-koffer');
      koffer.forEach(function (k) {
        var teile = [];
        if (k.standort) teile.push(standortLabel(k.standort));
        if (!bereichText(k) && k.kapazitaet > 1) teile.push(k.kapazitaet + ' Geräte');
        if (k.notiz) teile.push(k.notiz);
        g1.appendChild(label(k.barcode, k.bezeichnung, teile.join(' · '), false, kofferNummer(k), bereichText(k)));
      });
      // Zweiter Aufbau derselben Koffer als Etikettenbogen. Beide Fassungen
      // stehen im DOM; welche sichtbar (und gedruckt) wird, entscheidet die
      // Klasse 'zf' am body -- so bleibt der Wechsel ohne Neuladen moeglich.
      KOFFER_CACHE = koffer;
      var host = document.createElement('div'); host.id = 'zf-host';
      g1.parentNode.appendChild(host);
      zeichneBogen();

      // 2 . Aktions- & Stunden-Codes (kommen weiterhin aus daten.js -- reine
      // Ablauf-Steuercodes, kein Personenbezug, keine DB-Tabelle noetig)
      var g2 = section('Aktions- & Stunden-Codes (an der Wand)', 'Rückgabe und Last-Minute-Buchung für aktuelle/nächste Stunde oder Doppelstunde.', 'sec-aktionen');
      (M.AKTIONEN || []).forEach(function (a) { g2.appendChild(label(a.code, (a.icon ? a.icon + ' ' : '') + a.label, a.sub, true)); });
      (M.SLOTS || []).forEach(function (sl) { g2.appendChild(label(sl.code, sl.label, sl.sub || 'feste Stunde', true)); });

      // 3 . Lehrerliste zum Aushaengen. Der Barcode traegt "L-<Kuerzel>";
      // getippt nimmt die App auch das blanke Kuerzel an, und der Server
      // schneidet das Praefix ohnehin ab.
      var lehrerListe = (lehrer || []).filter(function (u) { return u.kuerzel && String(u.kuerzel).trim(); });
      lehrerListe.sort(function (a, b) {
        return String(a.display_name || a.kuerzel).localeCompare(String(b.display_name || b.kuerzel), 'de');
      });
      if (lehrerListe.length) {
        var g3 = section('Lehrerliste (an der Wand aushängen)',
          'Wandstation: erst den eigenen Code scannen, dann den Koffer. Auf dem eigenen iPad entfällt dieser Schritt — dort ist man bereits angemeldet.',
          'sec-lehrer', 'lehrer-grid');
        lehrerListe.forEach(function (u) {
          g3.appendChild(label('L-' + u.kuerzel, u.display_name || u.kuerzel, u.kuerzel));
        });
      } else {
        var w2 = document.createElement('div'); w2.className = 'warn'; w2.setAttribute('data-testid', 'warn-lehrer');
        w2.textContent = '⚠️ Keine Lehrerliste geladen — ohne angemeldete Sitzung liefert get_kollegium_public() nichts. Bitte in KRS Connect anmelden und neu laden.';
        root.appendChild(w2);
      }

      statusEl.textContent = koffer.length + ' Koffer-Etiketten (' + (quelle === 'db' ? 'aus der Datenbank' : 'Rückfall daten.js') + ') · ' +
        ((M.AKTIONEN || []).length + (M.SLOTS || []).length) + ' Aktions-Codes · ' +
        lehrerListe.length + ' Lehrer-Codes';
    }

    function fallbackAusDatenJs() {
      var koffer = (M.KOFFER || []).slice().sort(function (a, b) { return a.barcode < b.barcode ? -1 : 1; });
      render(koffer, 'fallback');
    }

    // ══ Etikettenbogen Avery Zweckform 3481 ═══════════════════════
    // 70 x 41 mm, 3 Spalten x 7 Zeilen = 21 Etiketten je A4-Bogen.
    // Nur die KOFFER kommen auf Etiketten -- die werden geklebt. Aktions-,
    // Stunden- und Lehrer-Codes haengen an der Wand und bleiben auf Papier.
    var ZF = { spalten: 3, zeilen: 7 };
    var KOFFER_CACHE = [];

    function el(tag, cls, text) {
      var d = document.createElement(tag);
      if (cls) d.className = cls;
      if (text != null) d.textContent = text;
      return d;
    }

    function zfEtikett(k) {
      var d = el('div', 'zf-label');
      var kopf = el('div', 'zf-kopf');
      var nr = kofferNummer(k);
      if (nr != null) kopf.appendChild(el('span', 'zf-nr', 'Koffer ' + nr));
      var bereich = bereichText(k);
      kopf.appendChild(el('span', 'zf-bereich', bereich || k.bezeichnung));
      d.appendChild(kopf);

      var teile = [];
      if (bereich) teile.push(k.bezeichnung);
      if (k.standort) teile.push(standortLabel(k.standort));
      if (!bereich && k.kapazitaet > 1) teile.push(k.kapazitaet + ' Ger\u00e4te');
      d.appendChild(el('div', 'zf-sub', teile.join(' \u00b7 ')));

      var codes = el('div', 'zf-codes');
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      codes.appendChild(svg);
      var qr = el('div', 'zf-qr');
      codes.appendChild(qr);
      d.appendChild(codes);
      d.appendChild(el('div', 'zf-code', k.barcode));

      try { if (window.JsBarcode) window.JsBarcode(svg, k.barcode, { format: 'CODE128', displayValue: false, margin: 0, height: 60 }); }
      catch (e) { /* Klartext unter dem Etikett traegt den Druck notfalls allein */ }
      try {
        if (window.QRCode && window.QRCode.toCanvas) {
          var c = document.createElement('canvas'); qr.appendChild(c);
          window.QRCode.toCanvas(c, k.barcode, { width: 160, margin: 0 }, function (err) { if (err) qr.textContent = ''; });
        }
      } catch (e2) { /* QR ist die Zugabe, CODE128 der Pflichtteil */ }
      return d;
    }

    function zeichneBogen() {
      var host = document.getElementById('zf-host');
      if (!host) return;
      host.innerHTML = '';
      var proBogen = ZF.spalten * ZF.zeilen;
      var freilassen = Math.max(0, Math.min(proBogen - 1, Number(document.getElementById('freilassen').value) || 0));
      var offx = Number(document.getElementById('offx').value) || 0;
      var offy = Number(document.getElementById('offy').value) || 0;
      var test = document.getElementById('rastertest').checked;

      // Erst die freizulassenden Plaetze (angebrochener Bogen), dann die Koffer.
      var plaetze = [];
      for (var f = 0; f < freilassen; f++) plaetze.push(null);
      KOFFER_CACHE.forEach(function (k) { plaetze.push(k); });

      for (var i = 0; i < plaetze.length; i += proBogen) {
        var bogen = el('div', 'zf-sheet' + (test ? ' zf-raster-test' : ''));
        var inner = el('div', 'zf-inner');
        inner.style.left = offx + 'mm';
        inner.style.top = offy + 'mm';
        var grid = el('div', 'zf-grid');
        plaetze.slice(i, i + proBogen).forEach(function (k) {
          grid.appendChild(k ? zfEtikett(k) : el('div', 'zf-label leer'));
        });
        inner.appendChild(grid);
        bogen.appendChild(inner);
        host.appendChild(bogen);
      }
    }

    function formatAnwenden() {
      var zf = document.getElementById('format').value === 'zf3481';
      document.body.classList.toggle('zf', zf);
      ['frei-wrap', 'just-wrap', 'test-wrap'].forEach(function (id) {
        document.getElementById(id).style.display = zf ? '' : 'none';
      });
      try { localStorage.setItem('krs-etiketten', JSON.stringify({
        format: document.getElementById('format').value,
        offx: document.getElementById('offx').value,
        offy: document.getElementById('offy').value
      })); } catch (e) { /* Privatmodus o. ae. -- die Einstellung ist nur Bequemlichkeit */ }
      zeichneBogen();
    }

    // Zuletzt benutzte Justierung wiederherstellen (pro Browser, pro Drucker).
    try {
      var gespeichert = JSON.parse(localStorage.getItem('krs-etiketten') || '{}');
      if (gespeichert.format) document.getElementById('format').value = gespeichert.format;
      if (gespeichert.offx != null) document.getElementById('offx').value = gespeichert.offx;
      if (gespeichert.offy != null) document.getElementById('offy').value = gespeichert.offy;
    } catch (e) { /* ohne gespeicherte Werte bleiben die Vorgaben */ }

    ['format', 'freilassen', 'offx', 'offy', 'rastertest'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', formatAnwenden);
      document.getElementById(id).addEventListener('input', formatAnwenden);
    });
    formatAnwenden();

    // Druckauswahl: steuert nur die Sichtbarkeit der Sektionen (CSS),
    // an den Etiketten selbst aendert sie nichts.
    Array.prototype.forEach.call(document.querySelectorAll('input[name="was"]'), function (r) {
      r.addEventListener('change', function () {
        document.body.classList.remove('nur-koffer', 'nur-lehrer');
        if (r.value === 'koffer') document.body.classList.add('nur-koffer');
        if (r.value === 'lehrer') document.body.classList.add('nur-lehrer');
      });
    });

    if (!window.supabase) { fallbackAusDatenJs(); return; }
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    client.auth.getSession().then(function (res) {
      var session = res && res.data && res.data.session;
      if (!session) {
        root.innerHTML = '<p class="hint">Bitte zuerst in KRS Connect anmelden — diese Seite nutzt dieselbe Sitzung. Danach neu laden.</p>';
        return;
      }
      return Promise.all([
        client.from('koffer_physisch').select('*').eq('aktiv', true).order('typ').order('barcode'),
        client.rpc('get_kollegium_public')
      ]).then(function (rs) {
        var rk = rs[0], rl = rs[1];
        if (rk.error || !rk.data || !rk.data.length) { fallbackAusDatenJs(); return; }
        render(rk.data, 'db', (!rl.error && rl.data) ? rl.data : null);
      });
    }).catch(function () { fallbackAusDatenJs(); });
  })();
  </script>
</body>
</html>
